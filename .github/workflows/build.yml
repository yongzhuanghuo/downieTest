name: Build

# 触发条件：push 到 main、打 tag（v*）、或手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# 说明：Flutter 桌面端位于 apps/desktop/，两个 job 都用 defaults.working-directory 切进去。
# 注意 actions/upload-artifact 的 path 相对 $GITHUB_WORKSPACE 解析，**不受 working-directory 影响**，
# 必须显式写 apps/desktop/ 前缀。

jobs:
  # ==================== macOS ====================
  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 下载 macOS 二进制（yt-dlp + ffmpeg）
        run: |
          mkdir -p assets/bin/macos assets/bin/windows
          curl -fL --retry 3 --retry-delay 2 -o assets/bin/macos/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x assets/bin/macos/yt-dlp
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ffmpeg.zip \
            https://evermeet.cx/ffmpeg/getrelease/zip
          unzip -o /tmp/ffmpeg.zip -d assets/bin/macos

      - name: 下载 node（抖音 a_bogus 签名用）
        run: |
          ARCH=$(uname -m)
          [ "$ARCH" = "x86_64" ] && NODE_ARCH=x64 || NODE_ARCH=arm64
          curl -fL --retry 3 -o /tmp/node.tar.gz \
            https://nodejs.org/dist/v22.13.1/node-v22.13.1-darwin-${NODE_ARCH}.tar.gz
          tar -xzf /tmp/node.tar.gz -C /tmp
          cp /tmp/node-v22.13.1-darwin-${NODE_ARCH}/bin/node assets/bin/macos/node
          chmod +x assets/bin/macos/node

      - name: 安装依赖
        run: flutter pub get

      - name: 打包 macOS
        run: flutter build macos --release --dart-define=API_BASE=http://8.153.99.239:3000

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: 4kdownle-pro-macos
          path: |
            apps/desktop/build/macos/Build/Products/Release/*.app
            docs/MAC安装前必看.docx
          retention-days: 30

  # ==================== Windows ====================
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 下载 Windows 二进制（yt-dlp.exe + ffmpeg.exe）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/bin/windows, assets/bin/macos | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "assets/bin/windows/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp"
          Get-ChildItem -Recurse -Filter "ffmpeg.exe" "ffmpeg_tmp" | Select-Object -First 1 | Copy-Item -Destination "assets/bin/windows/ffmpeg.exe"

      - name: 下载 node（抖音 a_bogus 签名用）
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.13.1/node-v22.13.1-win-x64.zip" -OutFile "node.zip"
          Expand-Archive -Path "node.zip" -DestinationPath "node_tmp"
          Copy-Item "node_tmp/node-v22.13.1-win-x64/node.exe" "assets/bin/windows/node.exe"

      - name: 安装依赖
        run: flutter pub get

      - name: 打包 Windows
        run: flutter build windows --release --dart-define=API_BASE=http://8.153.99.239:3000

      - name: 下载 WebView2 运行时安装器
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "windows/installer/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"

      - name: 生成安装包（Inno Setup）
        shell: pwsh
        # setup.iss 内部路径相对 .iss 自身（..\runner、..\..\build），
        # 所以必须在 apps/desktop 下执行 iscc，由 defaults.working-directory 保证
        run: |
          choco install innosetup -y --no-progress
          iscc windows/installer/setup.iss

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: 4kdownle-pro-windows-setup
          path: apps/desktop/windows/installer/Output/*.exe
          retention-days: 30

      - name: 上传产物（便携版）
        uses: actions/upload-artifact@v4
        with:
          name: 4kdownle-pro-windows
          path: apps/desktop/build/windows/x64/runner/Release/
          retention-days: 30
