name: Build

# 触发条件：push 到 main、打 tag（v*）、或手动触发
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  # ==================== macOS ====================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 下载 macOS 二进制（yt-dlp + ffmpeg）
        run: |
          mkdir -p assets/bin/macos assets/bin/windows
          curl -fL --retry 3 --retry-delay 2 -o assets/bin/macos/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x assets/bin/macos/yt-dlp
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ffmpeg.zip \
            https://evermeet.cx/ffmpeg/getrelease/zip
          unzip -o /tmp/ffmpeg.zip -d assets/bin/macos

      - name: 安装依赖
        run: flutter pub get

      - name: 打包 macOS
        run: flutter build macos --release

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: downie-pro-macos
          path: build/macos/Build/Products/Release/*.app
          retention-days: 30

  # ==================== Windows ====================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 下载 Windows 二进制（yt-dlp.exe + ffmpeg.exe）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets/bin/windows, assets/bin/macos | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "assets/bin/windows/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp"
          Get-ChildItem -Recurse -Filter "ffmpeg.exe" "ffmpeg_tmp" | Select-Object -First 1 | Copy-Item -Destination "assets/bin/windows/ffmpeg.exe"

      - name: 安装依赖
        run: flutter pub get

      - name: 打包 Windows
        run: flutter build windows --release

      - name: 下载 WebView2 运行时安装器
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "windows/installer/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"

      - name: 生成安装包（Inno Setup）
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          iscc windows/installer/setup.iss

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: downie-pro-windows-setup
          path: windows/installer/Output/*.exe
          retention-days: 30

      - name: 上传产物（便携版）
        uses: actions/upload-artifact@v4
        with:
          name: downie-pro-windows
          path: build/windows/x64/runner/Release/
          retention-days: 30
