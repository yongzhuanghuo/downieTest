name: Build

# 触发条件：打 tag（v*）或手动触发。平时 push 代码不构建；
# 想验证编译去 Actions 页面 Run workflow，想发版打 tag
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# 说明：Flutter 桌面端位于 apps/desktop/，两个 job 都用 defaults.working-directory 切进去。
# 注意 actions/upload-artifact 的 path 相对 $GITHUB_WORKSPACE 解析，**不受 working-directory 影响**，
# 必须显式写 apps/desktop/ 前缀。

jobs:
  # ==================== macOS x86_64 SABR yt-dlp ====================
  # macos-latest 是 arm64；Intel Mac 需要单独的 x86_64 SABR 二进制。
  # macOS 13 runner 已下线，x86_64 用 macos-15-intel。
  # 失败不阻断主构建：App 会回退官方 universal yt-dlp（没有 SABR）。
  build-ytdlp-macos-x64:
    runs-on: macos-15-intel
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 构建 x86_64 SABR yt-dlp
        run: python tools/build_sabr_ytdlp.py --output dist/yt-dlp_x86_64

      - name: 上传 x86_64 SABR yt-dlp
        uses: actions/upload-artifact@v4
        with:
          name: ytdlp-macos-x64
          path: apps/desktop/dist/yt-dlp_x86_64
          retention-days: 7

  # ==================== macOS ====================
  build-macos:
    needs: [build-ytdlp-macos-x64]
    if: always()
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: 导入 Developer ID 证书（可选）
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "BUILD_CERTIFICATE_BASE64 未配置，跳过 Developer ID 签名"
            exit 0
          fi
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > /tmp/build-certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/build-certificate.p12 -k build.keychain \
            -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f /tmp/build-certificate.p12

      - name: 配置公证凭据（可选）
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APP_SPECIFIC_PASSWORD" ]; then
            echo "APPLE_ID/APP_SPECIFIC_PASSWORD 未配置，跳过公证"
            exit 0
          fi
          xcrun notarytool store-credentials "4kdownle-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "${APPLE_TEAM_ID:-D4KD8XCCL6}" \
            --password "$APP_SPECIFIC_PASSWORD"

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 安装 Python（构建 SABR yt-dlp）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 下载 macOS 二进制（yt-dlp + ffmpeg universal）
        run: |
          mkdir -p assets/bin/macos assets/bin/windows
          curl -fL --retry 3 --retry-delay 2 -o assets/bin/macos/yt-dlp \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x assets/bin/macos/yt-dlp
          # ffmpeg 合成 universal：evermeet 只有 x86_64，
          # Apple Silicon 没 Rosetta 就完全不可用，必须双架构 lipo
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ffmpeg-x64 \
            https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-x64
          curl -fL --retry 3 --retry-delay 2 -o /tmp/ffmpeg-arm64 \
            https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64
          lipo -create /tmp/ffmpeg-x64 /tmp/ffmpeg-arm64 -output assets/bin/macos/ffmpeg
          chmod +x assets/bin/macos/ffmpeg

      - name: 下载 x86_64 SABR yt-dlp（Intel Mac）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ytdlp-macos-x64
          path: apps/desktop/assets/bin/macos

      - name: 构建 SABR 版 yt-dlp（YouTube 1080p）
        # 失败不阻断构建：App 会回退到上面的官方 universal yt-dlp
        continue-on-error: true
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then OUT=assets/bin/macos/yt-dlp_x86_64; else OUT=assets/bin/macos/yt-dlp_arm64; fi
          python tools/build_sabr_ytdlp.py --output "$OUT"

      - name: 校验 SABR yt-dlp 双架构都存在
        # x64 job 失败时这里会明确失败，避免 Intel 用户静默丢掉 YouTube 1080p
        run: |
          test -s assets/bin/macos/yt-dlp_arm64 || { echo "::error::缺少 yt-dlp_arm64"; exit 1; }
          test -s assets/bin/macos/yt-dlp_x86_64 || { echo "::error::缺少 yt-dlp_x86_64"; exit 1; }

      - name: 下载 node（抖音 a_bogus 签名用，双架构）
        run: |
          NODE_VERSION=v22.13.1
          for NODE_ARCH in arm64 x64; do
            curl -fL --retry 3 --retry-delay 2 -o "/tmp/node-${NODE_ARCH}.tar.gz" \
              "https://nodejs.org/dist/${NODE_VERSION}/node-${NODE_VERSION}-darwin-${NODE_ARCH}.tar.gz"
            tar -xzf "/tmp/node-${NODE_ARCH}.tar.gz" -C /tmp
            if [ "$NODE_ARCH" = "x64" ]; then OUT=node_x86_64; else OUT=node_arm64; fi
            cp "/tmp/node-${NODE_VERSION}-darwin-${NODE_ARCH}/bin/node" "assets/bin/macos/${OUT}"
            chmod +x "assets/bin/macos/${OUT}"
          done
          # 旧构建/开发态兜底：host 架构（runner 是 arm64）
          cp assets/bin/macos/node_arm64 assets/bin/macos/node
          chmod +x assets/bin/macos/node

      - name: 安装依赖
        run: flutter pub get

      - name: 单元测试
        run: |
          set -o pipefail
          flutter test test/site_plugin_test.dart test/bilibili_wbi_test.dart test/bilibili_plugin_test.dart test/generic_web_plugin_test.dart test/generic_html_extractor_test.dart test/download_task_test.dart test/trial_info_test.dart test/window_panel_test.dart test/url_extraction_test.dart test/search_engines_test.dart test/browser_bridge_test.dart test/playlist_test.dart test/site_cookies_test.dart test/file_naming_test.dart test/douyin_parser_test.dart test/site_coverage_test.dart test/format_selector_test.dart test/douyin_downloader_test.dart test/tiktok_plugin_test.dart test/kuaishou_plugin_test.dart test/weibo_plugin_test.dart test/import_links_test.dart test/automation_request_test.dart test/license_automation_test.dart test/support_report_test.dart test/adult_filter_test.dart test/ytdlp_args_test.dart 2>&1 | tee test_output.log

      - name: 测试失败注解
        if: failure()
        run: |
          if [ -f test_output.log ]; then
            grep -n -E '\[E\]|Expected:|Actual:|Test failed|Some tests failed|Failed to load|Error:|Exception|error:' test_output.log | tail -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi || true

      - name: 打包 macOS
        run: |
          set -o pipefail
          flutter build macos --release --dart-define=API_BASE=http://8.153.99.239:3000 --dart-define=YTDLP_BUILD=sabr-b7685f0-ejs-${{ github.sha }} 2>&1 | tee build_macos.log

      - name: 校验 macOS 双架构（Intel + Apple Silicon）
        run: bash tools/verify_macos_archs.sh build/macos/Build/Products/Release/4KDownle.app

      - name: macOS 构建失败注解
        if: failure()
        run: |
          if [ -f build_macos.log ]; then
            grep -n -E 'Error:|error:|Exception|FAILURE|Failed' build_macos.log | tail -80 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi || true

      - name: Developer ID 签名 app（可选）
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          if [ -z "$DEVELOPER_ID_APPLICATION" ]; then
            echo "DEVELOPER_ID_APPLICATION 未配置，跳过签名"
            exit 0
          fi
          tools/sign-and-notarize-macos.sh build/macos/Build/Products/Release/4KDownle.app

      - name: 组装 DMG（.app + 安装说明）
        run: |
          set -o pipefail
          {
            set -x
            # 仅诊断用途；runner 上偶发某个挂载点异常会让 df 返回 1，
            # 在 bash -e 下会直接中断 DMG 打包。
            df -h || true
            APP_DIR="dist/Downie6-macos"
            rm -rf "$APP_DIR" && mkdir -p "$APP_DIR/.background"
            echo "=== Release contents ==="
            ls -ld build/macos/Build/Products/Release/*.app || true
            APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print | head -1)
            echo "APP_PATH=$APP_PATH"
            test -n "$APP_PATH"
            test -d "$APP_PATH"
            cp -R "$APP_PATH" "$APP_DIR/Downie6.app"
            cp macos/installer/install-guide.png "$APP_DIR/安装说明.png"
            cp macos/installer/dmg-layout/.DS_Store "$APP_DIR/.DS_Store"
            cp macos/installer/dmg-layout/.background/background.png "$APP_DIR/.background/background.png"
            ln -s /Applications "$APP_DIR/Applications"
            rm -f Downie6.dmg
            du -sh "$APP_DIR"
            hdiutil create -volname "Downie6" -srcfolder "$APP_DIR" -ov -format UDZO -fs HFS+ "Downie6.dmg"
            hdiutil verify Downie6.dmg
          } 2>&1 | tee dmg.log

      - name: DMG 失败注解
        if: failure()
        run: |
          if [ -f dmg.log ]; then
            tail -100 dmg.log | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi || true

      - name: 签名/公证 DMG（可选）
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$DEVELOPER_ID_APPLICATION" ]; then
            echo "DEVELOPER_ID_APPLICATION 未配置，跳过 DMG 签名/公证"
            exit 0
          fi
          tools/sign-and-notarize-macos.sh \
            build/macos/Build/Products/Release/4KDownle.app \
            Downie6.dmg

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Downie6-pro-macos
          path: apps/desktop/Downie6.dmg
          retention-days: 30

  # ==================== Windows ====================
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 安装 Python（构建 SABR yt-dlp）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 下载 Windows 二进制（yt-dlp.exe + ffmpeg.exe）
        shell: pwsh
        run: |
          function Get-FileWithRetry([string]$Url, [string]$OutFile) {
            for ($i = 1; $i -le 4; $i++) {
              try {
                Write-Host "下载 $Url （第 $i 次）"
                Invoke-WebRequest -Uri $Url -OutFile $OutFile
                return
              } catch {
                Write-Host "失败: $_"
                if ($i -eq 4) { throw }
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
          New-Item -ItemType Directory -Force -Path assets/bin/windows, assets/bin/macos | Out-Null
          Get-FileWithRetry "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" "assets/bin/windows/yt-dlp.exe"
          Get-FileWithRetry "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_tmp"
          Get-ChildItem -Recurse -Filter "ffmpeg.exe" "ffmpeg_tmp" | Select-Object -First 1 | Copy-Item -Destination "assets/bin/windows/ffmpeg.exe"

      - name: 构建 SABR 版 yt-dlp（YouTube 1080p）
        # 失败不阻断构建：保留上面的官方 yt-dlp.exe 作为兜底
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/build_sabr_ytdlp.py --output assets/bin/windows/yt-dlp.exe

      - name: 下载 node（抖音 a_bogus 签名用）
        shell: pwsh
        run: |
          function Get-FileWithRetry([string]$Url, [string]$OutFile) {
            for ($i = 1; $i -le 4; $i++) {
              try {
                Invoke-WebRequest -Uri $Url -OutFile $OutFile
                return
              } catch {
                Write-Host "失败: $_"
                if ($i -eq 4) { throw }
                Start-Sleep -Seconds (5 * $i)
              }
            }
          }
          Get-FileWithRetry "https://nodejs.org/dist/v22.13.1/node-v22.13.1-win-x64.zip" "node.zip"
          Expand-Archive -Path "node.zip" -DestinationPath "node_tmp"
          Copy-Item "node_tmp/node-v22.13.1-win-x64/node.exe" "assets/bin/windows/node.exe"

      - name: 安装依赖
        run: flutter pub get

      - name: 打包 Windows
        shell: pwsh
        run: |
          flutter build windows --release --dart-define=API_BASE=http://8.153.99.239:3000 --dart-define=YTDLP_BUILD=sabr-b7685f0-ejs-${{ github.sha }} 2>&1 | Tee-Object -FilePath build_windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Windows 构建失败注解
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build_windows.log) {
            Get-Content build_windows.log |
              Select-String -Pattern 'Error|error|Exception|FAILED' |
              Select-Object -Last 80 |
              ForEach-Object { Write-Output "::error::$_" }
          }

      - name: 下载 WebView2 运行时安装器
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          for ($i = 1; $i -le 4; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "windows/installer/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
              break
            } catch {
              Write-Host "失败: $_"
              if ($i -eq 4) { throw }
              Start-Sleep -Seconds (5 * $i)
            }
          }

      - name: 生成安装包（Inno Setup）
        shell: pwsh
        # setup.iss 内部路径相对 .iss 自身（..\runner、..\..\build），
        # 所以必须在 apps/desktop 下执行 iscc，由 defaults.working-directory 保证
        run: |
          choco install innosetup -y --no-progress
          iscc windows/installer/setup.iss

      - name: 重命名安装包（固定名，供版本更新固定下载 URL）
        shell: pwsh
        run: |
          Get-ChildItem "windows/installer/Output/*.exe" | Rename-Item -NewName "Downie6-Windows-Setup.exe"

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Downie6-pro-windows-setup
          path: apps/desktop/windows/installer/Output/Downie6-Windows-Setup.exe
          retention-days: 30

      - name: 上传产物（便携版）
        uses: actions/upload-artifact@v4
        with:
          name: Downie6-pro-windows
          path: apps/desktop/build/windows/x64/runner/Release/
          retention-days: 30

  # ==================== 打 tag 上传安装包到阿里云 OSS ====================
  # GitHub Releases 国内经常下载不动，安装包改为固定名覆盖上传 OSS。
  # 服务端 .env 的 DOWNLOAD_URL_* 指向
  # https://4kdownlebucket.oss-cn-shanghai.aliyuncs.com/releases/<固定名>，配一次永久有效。
  # 前提（控制台一次性配置，见 docs/roadmap.md 阶段16）：
  #   1. GitHub 仓库 Secrets 配 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET
  #      （建议 RAM 子账号，只授该桶 PutObject 权限）
  #   2. bucket 对 releases/* 前缀开匿名只读（bucket 本体保持私有）
  release:
    # -ci 标签只跑构建和测试，不覆盖 OSS 正式包
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-ci')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 读取版本与构建号
        id: ver
        run: |
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+]+)\+.*/\1/p' apps/desktop/pubspec.yaml | head -1)
          BUILD=$(sed -nE 's/^version:[[:space:]]*[^+]+\+([0-9]+).*/\1/p' apps/desktop/pubspec.yaml | head -1)
          test -n "$VERSION" && test -n "$BUILD"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::tag $TAG_VERSION 与 pubspec version $VERSION 不一致"
            exit 1
          fi
          CHANGELOG=$(git log -1 --pretty=%s)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "changelog=$CHANGELOG" >> "$GITHUB_OUTPUT"

      - name: 计算安装包 SHA256/大小
        id: sums
        run: |
          DMG=dist/Downie6-pro-macos/Downie6.dmg
          EXE=dist/Downie6-pro-windows-setup/Downie6-Windows-Setup.exe
          echo "dmg_sha=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "dmg_size=$(stat -c%s "$DMG")" >> "$GITHUB_OUTPUT"
          echo "exe_sha=$(shasum -a 256 "$EXE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "exe_size=$(stat -c%s "$EXE")" >> "$GITHUB_OUTPUT"

      - name: 安装 ossutil
        # 不用官方 install.sh：它往 /usr/bin 拷贝不带 sudo，GitHub runner 上必挂
        run: |
          curl -fsSL -o /tmp/ossutil.zip https://gosspublic.alicdn.com/ossutil/current/ossutil-linux-amd64.zip
          unzip -o /tmp/ossutil.zip -d /tmp/ossutil_bin
          echo "/tmp/ossutil_bin/ossutil-linux-amd64" >> "$GITHUB_PATH"

      - name: 上传安装包到 OSS 固定地址
        env:
          OSS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          # bucket 实际区域为上海（已实测，hangzhou endpoint 会拒绝）
          # 注意 ossutil v2 密钥短选项是 -k（-s 是 shortFormat，cp 不支持会直接报错）
          LATEST=(-i "$OSS_KEY_ID" -k "$OSS_KEY_SECRET" -e oss-cn-shanghai.aliyuncs.com -f --meta Cache-Control:no-cache)

          # 固定下载地址，保持长期不变
          ossutil cp dist/Downie6-pro-macos/Downie6.dmg \
            oss://4kdownlebucket/releases/Downie6.dmg "${LATEST[@]}"
          ossutil cp dist/Downie6-pro-windows-setup/Downie6-Windows-Setup.exe \
            oss://4kdownlebucket/releases/Downie6-Windows-Setup.exe "${LATEST[@]}"

      - name: 通知服务端发布版本
        env:
          API_BASE: ${{ secrets.API_BASE }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
          CHANGELOG: ${{ steps.ver.outputs.changelog }}
          DMG_SHA: ${{ steps.sums.outputs.dmg_sha }}
          DMG_SIZE: ${{ steps.sums.outputs.dmg_size }}
          EXE_SHA: ${{ steps.sums.outputs.exe_sha }}
          EXE_SIZE: ${{ steps.sums.outputs.exe_size }}
        run: |
          test -n "$RELEASE_TOKEN" || { echo "::error::缺少 RELEASE_TOKEN secret"; exit 1; }
          API_BASE="${API_BASE:-http://8.153.99.239:3000}"
          BASE="https://4kdownlebucket.oss-cn-shanghai.aliyuncs.com"
          MACOS_URL="${BASE}/releases/Downie6.dmg"
          WINDOWS_URL="${BASE}/releases/Downie6-Windows-Setup.exe"
          export MACOS_URL WINDOWS_URL
          python3 - <<'PY'
          import json
          import os

          common = {
              "product": "downie6",
              "version": os.environ["VERSION"],
              "build": int(os.environ["BUILD"]),
              "changelog": os.environ.get("CHANGELOG", ""),
              "force": False,
          }
          macos = {
              **common,
              "platform": "macos",
              "url": os.environ["MACOS_URL"],
              "sha256": os.environ["DMG_SHA"],
              "size": int(os.environ["DMG_SIZE"]),
              "dmg_url": os.environ["MACOS_URL"],
          }
          windows = {
              **common,
              "platform": "windows",
              "url": os.environ["WINDOWS_URL"],
              "sha256": os.environ["EXE_SHA"],
              "size": int(os.environ["EXE_SIZE"]),
              "dmg_url": None,
          }
          open("/tmp/publish-macos.json", "w", encoding="utf-8").write(json.dumps(macos))
          open("/tmp/publish-windows.json", "w", encoding="utf-8").write(json.dumps(windows))
          PY
          for payload in /tmp/publish-macos.json /tmp/publish-windows.json; do
            curl -fsS -X POST "$API_BASE/api/internal/releases/publish" \
              -H "Content-Type: application/json" \
              -H "X-Release-Token: $RELEASE_TOKEN" \
              --data-binary "@$payload"
          done
