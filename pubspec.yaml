name: downie_test
description: "Downlo PRO - 网页视频下载工具"
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.0

  # 桌面窗口控制
  window_manager: ^0.4.2

  # 本地 KV 存储（设置项）
  hive: ^2.2.3
  path_provider: ^2.1.3

  # 本地 SQLite（下载历史 + 任务持久化）
  sqflite_common_ffi: ^2.3.3
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # 工具
  uuid: ^4.4.0
  crypto: ^3.0.5
  meta: ^1.15.0

  # HTTP（许可证后端通信）
  http: ^1.2.0

  # 文件/目录选择器（设置下载目录）
  file_picker: ^8.1.2
  flutter_inappwebview: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bin/macos/
    - assets/bin/windows/
