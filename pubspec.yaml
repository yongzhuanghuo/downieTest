name: downie_test
description: "Downlo PRO - 网页视频下载工具"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 路由
  go_router: ^14.2.0

  # 桌面窗口控制
  window_manager: ^0.4.2

  # 本地 KV 存储（设置项）
  hive: ^2.2.3
  path_provider: ^2.1.3

  # 工具
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # 代码生成
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/bin/macos/
    - assets/bin/windows/
